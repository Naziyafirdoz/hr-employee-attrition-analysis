name: Notebook CI - Reproducibility

on:
  push:
  pull_request:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"; exit 1
          fi

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute notebook/HR_Attrition_Analysis.ipynb --output executed_notebook.ipynb

      - name: Verify outputs and visuals directories
        run: |
          if [ -d outputs ] && [ -d visuals ]; then
            echo "Required folders exist";
          else
            echo "Missing outputs/ or visuals/ after notebook execution"; ls -la; exit 1
          fi

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed_notebook.ipynb
